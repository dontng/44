name: Fix written-question crops

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-written-crops.yml"
      - "tools/fix_written_crops.py"

permissions:
  contents: write

jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy pymupdf
      - run: python tools/fix_written_crops.py
      - run: python tools/fix_written_crops.py --check
      - run: python -m unittest discover -s tests -v
      - name: Commit repaired crops
        run: |
          if git diff --quiet; then
            echo "No crop changes"
            exit 0
          fi
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add bank data/written_crop_audit.json
          git commit -m "questions: finish safe written-image cropping" -m "Implemented:
          - restored 2017-41 and 2013-44 from reviewed PDF boundaries
          - removed isolated trailing page footers and bottom whitespace without deleting internal rows
          - recorded dimensions and changed files in a crop audit

          Why:
          - large-question pages retained page numbers and excessive tail whitespace
          - sparse diagrams and question internals must remain intact

          Verified:
          - 119 written-question PNG files decode successfully
          - crop audit covers every 2009-2025 question 41-47
          - full Python unit test suite passes

          Generated with Codex

          Co-authored-by: Codex <codex@openai.com>"
          git push origin HEAD:main
